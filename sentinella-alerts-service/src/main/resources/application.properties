spring.application.name=sentinella-alerts
sentinella.seed.enabled=${SENTINELLA_SEED_ENABLED:false}
sentinella.seed.force=${SENTINELLA_SEED_FORCE:false}
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella_alerts}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/v1/auth/jwks}

sentinella.monitoring.base-url=${MONITORING_BASE_URL:http://localhost:8082}
sentinella.iam.base-url=${IAM_BASE_URL:http://localhost:8081}
sentinella.internal.service-key=${SENTINELLA_INTERNAL_SERVICE_KEY:}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=${RABBIT_LISTENER_CONCURRENCY:3}
spring.rabbitmq.listener.simple.max-concurrency=${RABBIT_LISTENER_MAX_CONCURRENCY:10}
spring.rabbitmq.listener.simple.prefetch=${RABBIT_LISTENER_PREFETCH:20}

alerts.notifications.enabled=${ALERTS_NOTIFICATIONS_ENABLED:false}
alerts.notifications.email.enabled=${ALERTS_EMAIL_ENABLED:false}
alerts.notifications.email.api-url=${ALERTS_EMAIL_API_URL:https://api.sendgrid.com/v3/mail/send}
alerts.notifications.email.api-key=${ALERTS_EMAIL_API_KEY:}
alerts.notifications.email.from=${ALERTS_EMAIL_FROM:}
alerts.notifications.email.to=${ALERTS_EMAIL_TO:}

sentinella.resend.api-key=${SENTINELLA_RESEND_API_KEY:}
sentinella.resend.from-email=${SENTINELLA_RESEND_FROM_EMAIL:Sentinella <sentinella@excusasjeans.com>}
sentinella.app-url=${SENTINELLA_APP_URL:https://sentinella-frontend.vercel.app}

alerts.notifications.sms.enabled=${ALERTS_SMS_ENABLED:false}
alerts.notifications.sms.twilio.account-sid=${ALERTS_TWILIO_ACCOUNT_SID:}
alerts.notifications.sms.twilio.auth-token=${ALERTS_TWILIO_AUTH_TOKEN:}
alerts.notifications.sms.from=${ALERTS_SMS_FROM:}
alerts.notifications.sms.to=${ALERTS_SMS_TO:}
alerts.notifications.push.enabled=${ALERTS_PUSH_ENABLED:false}
alerts.notifications.push.expo-access-token=${EXPO_ACCESS_TOKEN:}

sentinella.alerts.escalation.enabled=${SENTINELLA_ALERT_ESCALATION_ENABLED:true}
sentinella.alerts.escalation.check-ms=${SENTINELLA_ALERT_ESCALATION_CHECK_MS:60000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
logging.level.root=${LOG_LEVEL:INFO}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
observability.trace-header=${TRACE_HEADER:X-Trace-Id}

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
