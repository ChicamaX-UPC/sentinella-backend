apiVersion: v1
kind: Namespace
metadata:
  name: sentinella
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sentinella
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: sentinella/api-gateway:latest
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-service
  namespace: sentinella
spec:
  replicas: 1
  selector:
    matchLabels:
