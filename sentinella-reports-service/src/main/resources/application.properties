spring.application.name=sentinella-reports
sentinella.seed.enabled=${SENTINELLA_SEED_ENABLED:false}
sentinella.seed.force=${SENTINELLA_SEED_FORCE:false}
sentinella.downstream.monitoring-base-url=${MONITORING_BASE_URL:http://localhost:8082}
sentinella.downstream.alerts-base-url=${ALERTS_BASE_URL:http://localhost:8083}
sentinella.downstream.fieldops-base-url=${PLANT_MANAGEMENT_BASE_URL:${FIELDOPS_BASE_URL:http://localhost:8092}}
sentinella.sendgrid.api-key=${SENTINELLA_SENDGRID_API_KEY:}
sentinella.sendgrid.from-email=${SENTINELLA_SENDGRID_FROM_EMAIL:reports@sentinella.demo}
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella_reports}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/v1/auth/jwks}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.default-requeue-rejected=false

storage.local.base-path=${STORAGE_LOCAL_BASE_PATH:${java.io.tmpdir}/sentinella-reports}

storage.s3.enabled=${STORAGE_S3_ENABLED:false}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.bucket=${STORAGE_S3_BUCKET:}
storage.s3.prefix=${STORAGE_S3_PREFIX:reports}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.download-url-expires-seconds=${STORAGE_S3_PRESIGN_SECONDS:3600}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
logging.level.root=${LOG_LEVEL:INFO}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
observability.trace-header=${TRACE_HEADER:X-Trace-Id}

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
