name: sentinella-backend

# Ejecutar desde esta carpella: cd sentinella-backend && docker compose up --build
# Con Fabric (un solo grupo Docker Desktop):
#   docker compose -f docker-compose.yml -f docker-compose.fabric.yml -f docker-compose.fabric-stack.yml --profile fabric up -d
# Copia .env.example → .env (claves Google Maps / SendGrid). El archivo .env no se commitea.
# IAM en el host: http://localhost:18081 (evita choque con otro servicio en 8081).
#
# Seed (sentinella.seed.enabled): IAM, monitoring, alerts, fieldops, simulations tienen ApplicationRunner demo.
# reports-service, nodeadmin-service, dashboard-service no tienen seeder en código; SENTINELLA_SEED_* solo aplica donde existe la clase.
# Los datos demo son idempotentes: si ya hay admin@sentinella.demo no se duplican. Para forzar DB limpia: docker compose down -v
#
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb local/sentinella --ignore-existing;
      exit 0;
      "

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  iam-service:
    build:
      context: .
      dockerfile: sentinella-iam-service/Dockerfile
    # Host 18081 si 8081 ya está en uso (p. ej. otro proceso Node). Dentro de la red Docker sigue siendo 8081.
    ports:
      - "18081:8081"
    environment:
      SERVER_PORT: "8081"
      SENTINELLA_SEED_ENABLED: ${SENTINELLA_SEED_ENABLED:-true}
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_iam
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SENTINELLA_INTERNAL_SERVICE_KEY: sentinella-internal-dev
      SENTINELLA_INTERNAL_REQUIRE_KEY: ${SENTINELLA_INTERNAL_REQUIRE_KEY:-false}
      SENTINELLA_AUTH_OPEN_REGISTRATION: ${SENTINELLA_AUTH_OPEN_REGISTRATION:-true}
      SENTINELLA_OPENAPI_PUBLIC: ${SENTINELLA_OPENAPI_PUBLIC:-true}
      SENTINELLA_FIELD_ENCRYPTION_KEY: ${SENTINELLA_FIELD_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  monitoring-service:
    build:
      context: .
      dockerfile: sentinella-monitoring-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      SENTINELLA_SEED_ENABLED: ${SENTINELLA_SEED_ENABLED:-true}
      SENTINELLA_SEED_FORCE: "${SENTINELLA_SEED_FORCE:-false}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_monitoring
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      SENTINELLA_INTERNAL_SERVICE_KEY: sentinella-internal-dev
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  alerts-service:
    build:
      context: .
      dockerfile: sentinella-alerts-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      SENTINELLA_SEED_ENABLED: ${SENTINELLA_SEED_ENABLED:-true}
      SENTINELLA_SEED_FORCE: "${SENTINELLA_SEED_FORCE:-false}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_alerts
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      MONITORING_BASE_URL: http://monitoring-service:8082
      IAM_BASE_URL: http://iam-service:8081
      SENTINELLA_INTERNAL_SERVICE_KEY: sentinella-internal-dev
      ALERTS_NOTIFICATIONS_ENABLED: "true"
      ALERTS_PUSH_ENABLED: "true"
      ALERTS_EMAIL_API_KEY: ${SENDGRID_API_KEY:-}
      ALERTS_EMAIL_FROM: ${SENDGRID_FROM_EMAIL:-}
      ALERTS_EMAIL_TO: ${ALERTS_EMAIL_TO:-}
      SENTINELLA_RESEND_API_KEY: ${SENTINELLA_RESEND_API_KEY:-}
      SENTINELLA_RESEND_FROM_EMAIL: ${SENTINELLA_RESEND_FROM_EMAIL:-Sentinella <sentinella@excusasjeans.com>}
      SENTINELLA_APP_URL: ${SENTINELLA_APP_URL:-https://sentinella-frontend.vercel.app}
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  plant-management-service:
    build:
      context: .
      dockerfile: sentinella-plant-management-service/Dockerfile
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: "8092"
      SENTINELLA_SEED_ENABLED: ${SENTINELLA_SEED_ENABLED:-true}
      SENTINELLA_SEED_FORCE: "${SENTINELLA_SEED_FORCE:-false}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_plant_management
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions-service:8091
      STORAGE_S3_ENABLED: "true"
      STORAGE_S3_BUCKET: sentinella
      STORAGE_S3_PREFIX: fieldops
      STORAGE_S3_ACCESS_KEY: minio
      STORAGE_S3_SECRET_KEY: minio12345
      STORAGE_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started
      subscriptions-service:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  profiles-service:
    build:
      context: .
      dockerfile: sentinella-profiles-service/Dockerfile
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: "8089"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_profiles
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  payments-service:
    build:
      context: .
      dockerfile: sentinella-payments-service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_payments
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/dashboard?billing=success&session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/subscribe?billing=cancel}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-http://localhost:3000/profile?billing=1}
      STRIPE_DEMO_CONFIRM_ENABLED: ${STRIPE_DEMO_CONFIRM_ENABLED:-false}
      SENTINELLA_SENDGRID_API_KEY: ${SENTINELLA_SENDGRID_API_KEY:-}
      SENTINELLA_SENDGRID_FROM_EMAIL: ${SENTINELLA_SENDGRID_FROM_EMAIL:-}
      SENTINELLA_RESEND_API_KEY: ${SENTINELLA_RESEND_API_KEY:-}
      SENTINELLA_RESEND_FROM_EMAIL: ${SENTINELLA_RESEND_FROM_EMAIL:-Sentinella <sentinella@excusasjeans.com>}
      SENTINELLA_APP_URL: ${SENTINELLA_APP_URL:-https://sentinella-frontend.vercel.app}
      STRIPE_PRICE_ECONOMY_RECURRING: ${STRIPE_PRICE_ECONOMY_RECURRING:-}
      STRIPE_PRICE_ECONOMY_SETUP: ${STRIPE_PRICE_ECONOMY_SETUP:-}
      STRIPE_PRICE_PREMIUM_RECURRING: ${STRIPE_PRICE_PREMIUM_RECURRING:-}
      STRIPE_PRICE_PREMIUM_SETUP: ${STRIPE_PRICE_PREMIUM_SETUP:-}
      STRIPE_PRICE_MAX_RECURRING: ${STRIPE_PRICE_MAX_RECURRING:-}
      STRIPE_PRICE_MAX_SETUP: ${STRIPE_PRICE_MAX_SETUP:-}
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  subscriptions-service:
    build:
      context: .
      dockerfile: sentinella-subscriptions-service/Dockerfile
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: "8091"
      SENTINELLA_SEED_ENABLED: ${SENTINELLA_SEED_ENABLED:-true}
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_subscriptions
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      payments-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  blockchain-service:
    build:
      context: .
      dockerfile: sentinella-blockchain-service/Dockerfile
    ports:
      - "8093:8093"
    environment:
      SERVER_PORT: "8093"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_blockchain
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      MONITORING_SERVICE_URL: http://monitoring-service:8082
      SENTINELLA_INTERNAL_SERVICE_KEY: sentinella-internal-dev
      BLOCKCHAIN_FABRIC_ENABLED: ${BLOCKCHAIN_FABRIC_ENABLED:-false}
      BLOCKCHAIN_FABRIC_CONNECTION_PROFILE: ${BLOCKCHAIN_FABRIC_CONNECTION_PROFILE:-/fabric/config/connection-org1.yaml}
      BLOCKCHAIN_FABRIC_USER_CERT: ${BLOCKCHAIN_FABRIC_USER_CERT:-/fabric/gateway-identity/cert.pem}
      BLOCKCHAIN_FABRIC_USER_KEY: ${BLOCKCHAIN_FABRIC_USER_KEY:-/fabric/gateway-identity/key.pem}
      BLOCKCHAIN_FABRIC_CHANNEL: ${BLOCKCHAIN_FABRIC_CHANNEL:-sentinellachannel}
      BLOCKCHAIN_FABRIC_CHAINCODE: ${BLOCKCHAIN_FABRIC_CHAINCODE:-sentinella-ledger}
    volumes:
      - ./infra/hyperledger-fabric/organizations:/fabric/organizations:ro
      - ./infra/hyperledger-fabric/gateway-identity:/fabric/gateway-identity:ro
      - ./infra/hyperledger-fabric/config:/fabric/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  dashboard-service:
    build:
      context: .
      dockerfile: sentinella-dashboard-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      IAM_BASE_URL: http://iam-service:8081
      SENTINELLA_INTERNAL_SERVICE_KEY: sentinella-internal-dev
      MONITORING_BASE_URL: http://monitoring-service:8082
      ALERTS_BASE_URL: http://alerts-service:8083
      FIELDOPS_BASE_URL: http://plant-management-service:8092
      SENTINELLA_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      iam-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      alerts-service:
        condition: service_started
      plant-management-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  reports-service:
    build:
      context: .
      dockerfile: sentinella-reports-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      STORAGE_LOCAL_BASE_PATH: /tmp/sentinella-reports
      STORAGE_S3_ENABLED: "true"
      STORAGE_S3_BUCKET: sentinella
      STORAGE_S3_PREFIX: reports
      STORAGE_S3_ACCESS_KEY: minio
      STORAGE_S3_SECRET_KEY: minio12345
      STORAGE_S3_ENDPOINT: http://minio:9000
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_reports
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      MONITORING_BASE_URL: http://monitoring-service:8082
      ALERTS_BASE_URL: http://alerts-service:8083
      FIELDOPS_BASE_URL: http://plant-management-service:8092
      SENTINELLA_SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENTINELLA_SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-sentinella@excusasjeans.com}
      SENTINELLA_RESEND_API_KEY: ${SENTINELLA_RESEND_API_KEY:-}
      SENTINELLA_RESEND_FROM_EMAIL: ${SENTINELLA_RESEND_FROM_EMAIL:-Sentinella <sentinella@excusasjeans.com>}
      SENTINELLA_APP_URL: ${SENTINELLA_APP_URL:-https://sentinella-frontend.vercel.app}
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      alerts-service:
        condition: service_started
      plant-management-service:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  simulations-service:
    build:
      context: .
      dockerfile: sentinella-simulations-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: "8087"
      SENTINELLA_SEED_ENABLED: ${SENTINELLA_SEED_ENABLED:-true}
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_simulations
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: sentinella-api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      IAM_SERVICE_URL: http://iam-service:8081
      MONITORING_SERVICE_URL: http://monitoring-service:8082
      ALERTS_SERVICE_URL: http://alerts-service:8083
      PLANT_MANAGEMENT_SERVICE_URL: http://plant-management-service:8092
      DASHBOARD_SERVICE_URL: http://dashboard-service:8085
      REPORTS_SERVICE_URL: http://reports-service:8086
      SIMULATIONS_SERVICE_URL: http://simulations-service:8087
      PROFILES_SERVICE_URL: http://profiles-service:8089
      PAYMENTS_SERVICE_URL: http://payments-service:8090
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions-service:8091
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8093
      SENTINELLA_OPENAPI_PUBLIC: ${SENTINELLA_OPENAPI_PUBLIC:-true}
    depends_on:
      - iam-service
      - monitoring-service
      - alerts-service
      - plant-management-service
      - profiles-service
      - payments-service
      - subscriptions-service
      - dashboard-service
      - reports-service
      - simulations-service
      - blockchain-service

networks:
  sentinella-fabric:
    name: sentinella-fabric
    driver: bridge

volumes:
  pgdata:
  minio_data:
