# Ejecutar desde esta carpella: cd sentinella-backend && docker compose up --build
# Copia .env.example → .env (claves Google Maps / SendGrid). El archivo .env no se commitea.
# IAM en el host: http://localhost:18081 (evita choque con otro servicio en 8081).
#
# Seed (sentinella.seed.enabled): IAM, monitoring, alerts, fieldops, simulations tienen ApplicationRunner demo.
# reports-service, nodeadmin-service, dashboard-service no tienen seeder en código; SENTINELLA_SEED_* solo aplica donde existe la clase.
# Los datos demo son idempotentes: si ya hay admin@sentinella.demo no se duplican. Para forzar DB limpia: docker compose down -v
#
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  iam-service:
    build:
      context: .
      dockerfile: sentinella-iam-service/Dockerfile
    # Host 18081 si 8081 ya está en uso (p. ej. otro proceso Node). Dentro de la red Docker sigue siendo 8081.
    ports:
      - "18081:8081"
    environment:
      SERVER_PORT: "8081"
      SENTINELLA_SEED_ENABLED: "true"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_iam
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  monitoring-service:
    build:
      context: .
      dockerfile: sentinella-monitoring-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      SENTINELLA_SEED_ENABLED: "true"
      SENTINELLA_SEED_FORCE: "${SENTINELLA_SEED_FORCE:-false}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_monitoring
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  alerts-service:
    build:
      context: .
      dockerfile: sentinella-alerts-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      SENTINELLA_SEED_ENABLED: "true"
      SENTINELLA_SEED_FORCE: "${SENTINELLA_SEED_FORCE:-false}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_alerts
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      MONITORING_BASE_URL: http://monitoring-service:8082
      ALERTS_EMAIL_API_KEY: ${SENDGRID_API_KEY:-}
      ALERTS_EMAIL_FROM: ${SENDGRID_FROM_EMAIL:-}
      ALERTS_EMAIL_TO: ${ALERTS_EMAIL_TO:-}
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  plant-management-service:
    build:
      context: .
      dockerfile: sentinella-plant-management-service/Dockerfile
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: "8092"
      SENTINELLA_SEED_ENABLED: "true"
      SENTINELLA_SEED_FORCE: "${SENTINELLA_SEED_FORCE:-false}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_plant_management
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  profiles-service:
    build:
      context: .
      dockerfile: sentinella-profiles-service/Dockerfile
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: "8089"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_profiles
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  payments-service:
    build:
      context: .
      dockerfile: sentinella-payments-service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_payments
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  subscriptions-service:
    build:
      context: .
      dockerfile: sentinella-subscriptions-service/Dockerfile
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: "8091"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_subscriptions
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      payments-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  blockchain-service:
    build:
      context: .
      dockerfile: sentinella-blockchain-service/Dockerfile
    ports:
      - "8093:8093"
    environment:
      SERVER_PORT: "8093"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_blockchain
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  dashboard-service:
    build:
      context: .
      dockerfile: sentinella-dashboard-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      MONITORING_BASE_URL: http://monitoring-service:8082
      ALERTS_BASE_URL: http://alerts-service:8083
      FIELDOPS_BASE_URL: http://plant-management-service:8092
      SENTINELLA_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      iam-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      alerts-service:
        condition: service_started
      plant-management-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  reports-service:
    build:
      context: .
      dockerfile: sentinella-reports-service/Dockerfile
    env_file:
      - .env
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      STORAGE_LOCAL_BASE_PATH: /tmp/sentinella-reports
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_reports
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
      MONITORING_BASE_URL: http://monitoring-service:8082
      ALERTS_BASE_URL: http://alerts-service:8083
      FIELDOPS_BASE_URL: http://plant-management-service:8092
      SENTINELLA_SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENTINELLA_SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-reports@sentinella.demo}
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      alerts-service:
        condition: service_started
      plant-management-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  simulations-service:
    build:
      context: .
      dockerfile: sentinella-simulations-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: "8087"
      SENTINELLA_SEED_ENABLED: "true"
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinella_simulations
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWK_SET_URI: http://iam-service:8081/v1/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      iam-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: sentinella-api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      IAM_SERVICE_URL: http://iam-service:8081
      MONITORING_SERVICE_URL: http://monitoring-service:8082
      ALERTS_SERVICE_URL: http://alerts-service:8083
      PLANT_MANAGEMENT_SERVICE_URL: http://plant-management-service:8092
      DASHBOARD_SERVICE_URL: http://dashboard-service:8085
      REPORTS_SERVICE_URL: http://reports-service:8086
      SIMULATIONS_SERVICE_URL: http://simulations-service:8087
      PROFILES_SERVICE_URL: http://profiles-service:8089
      PAYMENTS_SERVICE_URL: http://payments-service:8090
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions-service:8091
    depends_on:
      - iam-service
      - monitoring-service
      - alerts-service
      - plant-management-service
      - profiles-service
      - payments-service
      - subscriptions-service
      - dashboard-service
      - reports-service
      - simulations-service
      - blockchain-service

volumes:
  pgdata:
  minio_data:
