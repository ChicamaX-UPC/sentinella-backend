spring.application.name=sentinella-dashboard
server.port=${SERVER_PORT:8085}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/v1/auth/jwks}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.default-requeue-rejected=false

sentinella.downstream.monitoring-base-url=${MONITORING_BASE_URL:http://localhost:8082}
sentinella.downstream.alerts-base-url=${ALERTS_BASE_URL:http://localhost:8083}
sentinella.downstream.fieldops-base-url=${PLANT_MANAGEMENT_BASE_URL:${FIELDOPS_BASE_URL:http://localhost:8092}}
sentinella.google-maps.api-key=${SENTINELLA_GOOGLE_MAPS_API_KEY:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
logging.level.root=${LOG_LEVEL:INFO}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
observability.trace-header=${TRACE_HEADER:X-Trace-Id}

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
