spring.application.name=sentinella-blockchain
server.port=${SERVER_PORT:8093}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella_blockchain}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/v1/auth/jwks}

sentinella.monitoring.base-url=${MONITORING_SERVICE_URL:http://localhost:8082}
sentinella.internal.service-key=${SENTINELLA_INTERNAL_SERVICE_KEY:}

management.endpoints.web.exposure.include=health,info

# Hyperledger Fabric (deshabilitado por defecto; ver infra/hyperledger-fabric/)
sentinella.blockchain.fabric.enabled=${BLOCKCHAIN_FABRIC_ENABLED:false}
sentinella.blockchain.fabric.connection-profile=${BLOCKCHAIN_FABRIC_CONNECTION_PROFILE:/fabric/config/connection-org1.yaml}
sentinella.blockchain.fabric.cert-path=${BLOCKCHAIN_FABRIC_USER_CERT:/fabric/gateway-identity/cert.pem}
sentinella.blockchain.fabric.key-path=${BLOCKCHAIN_FABRIC_USER_KEY:/fabric/gateway-identity/key.pem}
sentinella.blockchain.fabric.msp-id=${BLOCKCHAIN_FABRIC_MSP_ID:Org1MSP}
sentinella.blockchain.fabric.channel=${BLOCKCHAIN_FABRIC_CHANNEL:sentinellachannel}
sentinella.blockchain.fabric.chaincode=${BLOCKCHAIN_FABRIC_CHAINCODE:sentinella-ledger}
sentinella.blockchain.fabric.retry.max-attempts=${BLOCKCHAIN_FABRIC_RETRY_MAX:3}
sentinella.blockchain.fabric.retry.delay-ms=${BLOCKCHAIN_FABRIC_RETRY_DELAY_MS:2000}
sentinella.blockchain.fabric.retry.multiplier=${BLOCKCHAIN_FABRIC_RETRY_MULTIPLIER:2}
sentinella.blockchain.dlq.max-republish=${BLOCKCHAIN_DLQ_MAX_REPUBLISH:5}
