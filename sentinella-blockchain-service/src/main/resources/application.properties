spring.application.name=sentinella-blockchain
server.port=${SERVER_PORT:8093}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella_blockchain}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/v1/auth/jwks}

management.endpoints.web.exposure.include=health,info
