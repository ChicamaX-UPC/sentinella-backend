spring.application.name=sentinella-backend

# Demo: usuarios, nodos, alertas y lecturas (idempotente). Desactivar en producción si no aplica.
sentinella.seed.enabled=${SENTINELLA_SEED_ENABLED:true}

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

logging.level.root=${LOG_LEVEL:INFO}
observability.trace-header=${TRACE_HEADER:X-Trace-Id}
observability.node-offline-metric.enabled=true
observability.node-offline-metric.fixed-delay-ms=${NODE_OFFLINE_METRIC_DELAY_MS:30000}
management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.access-expiry=${JWT_ACCESS_EXPIRY:900}
jwt.refresh-expiry=${JWT_REFRESH_EXPIRY:604800}

alerts.notifications.enabled=${ALERTS_NOTIFICATIONS_ENABLED:false}
alerts.notifications.email.enabled=${ALERTS_EMAIL_ENABLED:false}
alerts.notifications.email.api-url=${ALERTS_EMAIL_API_URL:https://api.sendgrid.com/v3/mail/send}
alerts.notifications.email.api-key=${ALERTS_EMAIL_API_KEY:}
alerts.notifications.email.from=${ALERTS_EMAIL_FROM:}
alerts.notifications.email.to=${ALERTS_EMAIL_TO:}
alerts.notifications.sms.enabled=${ALERTS_SMS_ENABLED:false}
alerts.notifications.sms.twilio.account-sid=${ALERTS_TWILIO_ACCOUNT_SID:}
alerts.notifications.sms.twilio.auth-token=${ALERTS_TWILIO_AUTH_TOKEN:}
alerts.notifications.sms.from=${ALERTS_SMS_FROM:}
alerts.notifications.sms.to=${ALERTS_SMS_TO:}

storage.s3.enabled=${STORAGE_S3_ENABLED:false}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.bucket=${STORAGE_S3_BUCKET:}
storage.s3.prefix=${STORAGE_S3_PREFIX:reports}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.download-url-expires-seconds=${STORAGE_S3_PRESIGN_SECONDS:3600}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

sentinella.presence.offline-after-seconds=${SENTINELLA_PRESENCE_OFFLINE_AFTER_SECONDS:120}
sentinella.presence.check-ms=${SENTINELLA_PRESENCE_CHECK_MS:30000}
sentinella.alerts.escalation.enabled=${SENTINELLA_ALERT_ESCALATION_ENABLED:true}
sentinella.alerts.escalation.check-ms=${SENTINELLA_ALERT_ESCALATION_CHECK_MS:60000}
