spring.datasource.url=jdbc:h2:mem:sentinella;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=false

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

alerts.notifications.enabled=false

storage.s3.enabled=false

observability.node-offline-metric.enabled=false
spring.task.scheduling.enabled=false
sentinella.alerts.escalation.enabled=false
sentinella.seed.enabled=false
