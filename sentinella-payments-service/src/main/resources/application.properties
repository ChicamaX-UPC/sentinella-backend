spring.application.name=sentinella-payments
server.port=${SERVER_PORT:8090}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella_payments}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/v1/auth/jwks}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
logging.level.root=${LOG_LEVEL:INFO}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
observability.trace-header=${TRACE_HEADER:X-Trace-Id}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/dashboard?billing=success&session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/subscribe?billing=cancel}
stripe.portal-return-url=${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/profile?billing=1}
stripe.demo-confirm-enabled=${STRIPE_DEMO_CONFIRM_ENABLED:false}
stripe.plans.economy.recurring-price-id=${STRIPE_PRICE_ECONOMY_RECURRING:}
stripe.plans.economy.setup-price-id=${STRIPE_PRICE_ECONOMY_SETUP:}
stripe.plans.premium.recurring-price-id=${STRIPE_PRICE_PREMIUM_RECURRING:}
stripe.plans.premium.setup-price-id=${STRIPE_PRICE_PREMIUM_SETUP:}
stripe.plans.max.recurring-price-id=${STRIPE_PRICE_MAX_RECURRING:}
stripe.plans.max.setup-price-id=${STRIPE_PRICE_MAX_SETUP:}

sentinella.resend.api-key=${SENTINELLA_RESEND_API_KEY:}
sentinella.resend.from-email=${SENTINELLA_RESEND_FROM_EMAIL:Sentinella <sentinella@excusasjeans.com>}
sentinella.sendgrid.api-key=${SENTINELLA_SENDGRID_API_KEY:}
sentinella.sendgrid.from-email=${SENTINELLA_SENDGRID_FROM_EMAIL:sentinella@excusasjeans.com}
sentinella.app-url=${SENTINELLA_APP_URL:https://sentinella-frontend.vercel.app}

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
