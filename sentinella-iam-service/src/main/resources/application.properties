spring.application.name=sentinella-iam
sentinella.seed.enabled=${SENTINELLA_SEED_ENABLED:false}
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella_iam}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.access-expiry=${JWT_ACCESS_EXPIRY:900}
jwt.refresh-expiry=${JWT_REFRESH_EXPIRY:604800}

sentinella.encryption.field-key=${SENTINELLA_FIELD_ENCRYPTION_KEY:}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

logging.level.root=${LOG_LEVEL:INFO}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

observability.trace-header=${TRACE_HEADER:X-Trace-Id}
sentinella.internal.service-key=${SENTINELLA_INTERNAL_SERVICE_KEY:}
sentinella.internal.require-key=${SENTINELLA_INTERNAL_REQUIRE_KEY:false}

sentinella.auth.rate-limit.max-attempts=${SENTINELLA_AUTH_RATE_LIMIT_MAX:20}
sentinella.auth.rate-limit.window-ms=${SENTINELLA_AUTH_RATE_LIMIT_WINDOW_MS:60000}
sentinella.auth.ws-ticket-ttl-seconds=${SENTINELLA_AUTH_WS_TICKET_TTL_SECONDS:30}
sentinella.auth.open-registration-enabled=${SENTINELLA_AUTH_OPEN_REGISTRATION:true}
sentinella.openapi.public=${SENTINELLA_OPENAPI_PUBLIC:true}
management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
