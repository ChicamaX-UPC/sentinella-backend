# Perfil producción: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requiere SENTINELLA_INTERNAL_SERVICE_KEY distinta de sentinella-internal-dev en .env
services:
  iam-service:
    environment:
      SENTINELLA_SEED_ENABLED: "false"
      SENTINELLA_AUTH_OPEN_REGISTRATION: "false"
      SENTINELLA_INTERNAL_REQUIRE_KEY: "true"
      SENTINELLA_OPENAPI_PUBLIC: "false"

  monitoring-service:
    environment:
      SENTINELLA_SEED_ENABLED: "false"
      SENTINELLA_INTERNAL_REQUIRE_KEY: "true"
      SENTINELLA_OPENAPI_PUBLIC: "false"

  alerts-service:
    environment:
      SENTINELLA_SEED_ENABLED: "false"
      SENTINELLA_OPENAPI_PUBLIC: "false"

  plant-management-service:
    environment:
      SENTINELLA_SEED_ENABLED: "false"
      SENTINELLA_OPENAPI_PUBLIC: "false"

  simulations-service:
    environment:
      SENTINELLA_SEED_ENABLED: "false"
      SENTINELLA_OPENAPI_PUBLIC: "false"

  api-gateway:
    environment:
      SENTINELLA_OPENAPI_PUBLIC: "false"

  dashboard-service:
    environment:
      SENTINELLA_OPENAPI_PUBLIC: "false"

  reports-service:
    environment:
      SENTINELLA_OPENAPI_PUBLIC: "false"

  payments-service:
    environment:
      SENTINELLA_OPENAPI_PUBLIC: "false"

  subscriptions-service:
    environment:
      SENTINELLA_OPENAPI_PUBLIC: "false"

  profiles-service:
    environment:
      SENTINELLA_OPENAPI_PUBLIC: "false"

  blockchain-service:
    environment:
      SENTINELLA_OPENAPI_PUBLIC: "false"
      BLOCKCHAIN_FABRIC_ENABLED: ${BLOCKCHAIN_FABRIC_ENABLED:-true}
      BLOCKCHAIN_FABRIC_CONNECTION_PROFILE: ${BLOCKCHAIN_FABRIC_CONNECTION_PROFILE:-/fabric/config/connection-org1.yaml}
      BLOCKCHAIN_FABRIC_USER_CERT: ${BLOCKCHAIN_FABRIC_USER_CERT:-/fabric/gateway-identity/cert.pem}
      BLOCKCHAIN_FABRIC_USER_KEY: ${BLOCKCHAIN_FABRIC_USER_KEY:-/fabric/gateway-identity/key.pem}
      BLOCKCHAIN_FABRIC_CHANNEL: ${BLOCKCHAIN_FABRIC_CHANNEL:-sentinellachannel}
      BLOCKCHAIN_FABRIC_CHAINCODE: ${BLOCKCHAIN_FABRIC_CHAINCODE:-sentinella-ledger}
      BLOCKCHAIN_FABRIC_RETRY_MAX: ${BLOCKCHAIN_FABRIC_RETRY_MAX:-5}
      BLOCKCHAIN_DLQ_MAX_REPUBLISH: ${BLOCKCHAIN_DLQ_MAX_REPUBLISH:-10}
    volumes:
      - ./infra/hyperledger-fabric/organizations:/fabric/organizations:ro
      - ./infra/hyperledger-fabric/gateway-identity:/fabric/gateway-identity:ro
      - ./infra/hyperledger-fabric/config:/fabric/config:ro
    networks:
      - sentinella-fabric

networks:
  sentinella-fabric:
    name: sentinella-fabric
