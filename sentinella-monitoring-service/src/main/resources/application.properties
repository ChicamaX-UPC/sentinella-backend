spring.application.name=sentinella-monitoring
sentinella.seed.enabled=${SENTINELLA_SEED_ENABLED:false}
sentinella.seed.force=${SENTINELLA_SEED_FORCE:false}
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinella_monitoring}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.chicamax.sentinella.shared.infrastructure.persistence.jpa.SnakeCaseNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8081/v1/auth/jwks}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.default-requeue-rejected=false

sentinella.presence.offline-after-seconds=${SENTINELLA_PRESENCE_OFFLINE_AFTER_SECONDS:120}
sentinella.presence.check-ms=${SENTINELLA_PRESENCE_CHECK_MS:30000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
logging.level.root=${LOG_LEVEL:INFO}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
observability.trace-header=${TRACE_HEADER:X-Trace-Id}
observability.node-offline-metric.enabled=true
observability.node-offline-metric.fixed-delay-ms=${NODE_OFFLINE_METRIC_DELAY_MS:30000}

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
